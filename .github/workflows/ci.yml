name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - if: matrix.app == 'api'
        run: npm test
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations on disposable PostgreSQL 17
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from test-api
      - name: Remove disposable test services
        if: always()
        run: docker compose -f compose.test.yaml down
